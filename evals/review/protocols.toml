text = """
Each sensor package bears the name and place of business of GlucoSense Inc., 12 Harbor Drive, San Diego, CA 92101, the quantity of contents, and the statement "CAUTION—Investigational device. Limited by Federal (or United States) law to investigational use." The Instructions for Use describe all relevant contraindications, hazards, adverse effects, interfering substances, warnings, and precautions. Appendix B contains copies of all labeling.
"""

[[protocol.section]]
