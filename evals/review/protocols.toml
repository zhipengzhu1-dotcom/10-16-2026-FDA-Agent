issue = "Investigators get 30 calendar days to report unanticipated adverse device effects; the regulation allows no more than 10 working days."

[[protocol.section]]
heading = "Record Retention"
text = """
Investigators and the sponsor keep all study records for one year after the investigation is completed.
"""

[protocol.section.violation]
