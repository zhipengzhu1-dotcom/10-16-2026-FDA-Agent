[[protocol]]
id = "glp-01"
domain = "GLP"
held_out = false
title = "Study TX-401-T28: A 28-Day Repeat-Dose Oral Gavage Toxicity Study of TX-401 in Rats"

[[protocol.section]]
heading = "Title and Purpose"
text = """
This study characterizes the toxicity of TX-401 given by oral gavage once daily for 28 days, followed by a 14-day recovery period, to support a first-in-human trial.
"""

[[protocol.section]]
heading = "Test and Control Articles"
text = """
The test article is TX-401 (code TX-401-HCl, CAS 0000000-00-0). The control article is 0.5 percent methylcellulose in purified water.

The sponsor determines and documents the identity, strength, purity, and composition of each batch of TX-401 and of the control article, and the stability of each before the study starts, and documents the method of synthesis. Reserve samples of each batch of test and control article are kept in the archive. TX-401 is suspended in the methylcellulose vehicle. Stability in that vehicle was shown before the study, and each formulation is analyzed for uniformity and concentration in Weeks 1 and 4.
"""

[[protocol.section]]
heading = "Sponsor and Testing Facility"
text = """
The sponsor is Tenex Therapeutics, Inc. The study is conducted at Northfield Preclinical Services, 45 Research Park Road, Durham, NC 27709.
"""

[[protocol.section]]
heading = "Test System"
text = """
Rats are obtained from an approved vendor and acclimated for at least five days before dosing. Animals are housed in pairs in a controlled environment.
"""

[protocol.section.violation]
citation = "21 CFR 58.120(a)(4)"
quote = "The number, body weight range, sex, source of supply, species, strain, substrain, and age of the test system."
issue = "The test system is not described by number, body weight range, sex, strain, or age."

[[protocol.section]]
heading = "Animal Identification"
text = """
Each animal is identified by a unique ear tattoo and by a cage card that shows the study number, animal number, and dose group.
"""

[[protocol.section]]
heading = "Study Design"
text = """
Animals are assigned to the control and three dose groups by computer-generated randomization stratified by body weight. Recovery subgroups in the control and high-dose groups are kept for 14 days without dosing. Histopathology is read by a pathologist and reviewed by a second pathologist who does not know the dose group.
"""

[[protocol.section]]
heading = "Diet and Vehicle"
text = """
Animals receive certified rodent diet and filtered tap water ad libitum. The supplier analyzes each diet lot for heavy metals, aflatoxins, pesticides, and PCBs, and only lots within the facility's written contaminant specifications are used. Water is analyzed twice a year against the same specifications. The only material used to suspend TX-401 is the 0.5 percent methylcellulose vehicle.
"""

[[protocol.section]]
heading = "Dosage"
text = """
TX-401 is given at 0, 30, 100, and 300 mg/kg/day by oral gavage once daily at a dose volume of 10 mL/kg. The high dose is the maximum feasible dose based on a 7-day range-finding study.
"""

[[protocol.section]]
heading = "Observations and Measurements"
text = """
Clinical observations are made twice daily, and body weight and food consumption are measured weekly. Hematology, clinical chemistry, coagulation, and urinalysis are done on Day 29 and at the end of recovery. All animals get a full necropsy with organ weights, and a full list of tissues is examined microscopically in the control and high-dose groups.
"""

[[protocol.section]]
heading = "Records"
text = """
The study keeps the protocol and its amendments, all raw data, dose formulation records, test article receipt and use records, specimens, quality assurance reports, and the final report.
"""

[[protocol.section]]
heading = "Statistical Methods"
text = """
Body weights, food consumption, clinical pathology values, and organ weights are compared between each dose group and the control with one-way analysis of variance followed by Dunnett's test, at a two-sided significance level of 0.05.
"""

[[protocol.section]]
heading = "Protocol Approval"
text = """
The sponsor approved this protocol on 9 February 2026. The study director, Dr. Grace Imani, signed and dated it on 10 February 2026.
"""

[[protocol.section]]
heading = "Quality Assurance"
text = """
The laboratory supervisor who leads the in-life team for this study performs the quality assurance inspections of the in-life phase and audits the final report.
"""

[protocol.section.violation]
citation = "21 CFR 58.35(a)"
quote = "the quality assurance unit shall be entirely separate from and independent of the personnel engaged in the direction and conduct of that study"
issue = "Quality assurance is performed by a member of the study's own in-life team."

[[protocol.section]]
heading = "Data Recording"
text = """
Technicians record in-life observations in pencil on paper worksheets. A data clerk transcribes the worksheets into the study database each week, and the worksheets are kept as raw data.
"""

[protocol.section.violation]
citation = "21 CFR 58.130(e)"
quote = "shall be recorded directly, promptly, and legibly in ink"
issue = "Raw data are recorded in pencil instead of ink."

[[protocol]]
id = "glp-02"
domain = "GLP"
held_out = false
title = "Study DX-7-S01: Dermal Sensitization Study of Topical Formulation DX-7 in Guinea Pigs (Maximization Test)"

[[protocol.section]]
heading = "Title and Purpose"
text = """
This study assesses the potential of DX-7 cream to cause delayed contact hypersensitivity, using the guinea pig maximization test.
"""

[[protocol.section]]
heading = "Test and Control Articles"
text = """
The test article is DX-7 cream (code DX-7-C, batch 26A01). The control article is the cream base without DX-7 (code DX-7-V, batch 26V01), whose identity, strength, purity, and composition are determined and documented for its batch. The sponsor determined the stability of both articles before the study started.

For the intradermal induction injections, each article is mixed with an emulsion of Freund's complete adjuvant. The uniformity, concentration, and stability of each mixture are analyzed before use.
"""

[[protocol.section]]
heading = "Sponsor and Testing Facility"
text = """
The sponsor is Dermax Laboratories, Inc. The study is conducted at Northfield Preclinical Services, 45 Research Park Road, Durham, NC 27709.
"""

[[protocol.section]]
heading = "Test Article Characterization"
text = """
The sponsor supplies DX-7 from a single new batch. The sponsor will not provide an analysis of identity, strength, or purity for this batch because the formulation is unchanged from earlier batches.
"""

[protocol.section.violation]
citation = "21 CFR 58.105(a)"
quote = "shall be determined for each batch and shall be documented"
issue = "The identity, strength, and purity of the test article batch are not determined or documented."

[[protocol.section]]
heading = "Test System"
text = """
Thirty female Dunkin Hartley guinea pigs of the EH:DH substrain from Elm Hill Breeding Labs, 5 to 8 weeks old and weighing 300 to 500 g, are used: 20 in the test group and 10 in the control group. Each animal is identified by an ear tag and a cage card.
"""

[[protocol.section]]
heading = "Study Design"
text = """
Animals are assigned to the test and control groups by computer-generated randomization. Challenge sites are scored by a technician who does not know the animal's group.
"""

[[protocol.section]]
heading = "Diet"
text = """
Animals receive certified guinea pig diet with added vitamin C and filtered tap water ad libitum. The supplier analyzes each diet lot for heavy metals, aflatoxins, pesticides, and PCBs, and only lots within the facility's written contaminant specifications are used. No solvent or emulsifier other than the Freund's adjuvant emulsion is used with the test or control article.
"""

[[protocol.section]]
heading = "Dosage and Administration"
text = """
Animals receive intradermal injections and topical applications of DX-7 during induction, followed by a topical challenge on Day 21.
"""

[protocol.section.violation]
citation = "21 CFR 58.120(a)(8)"
quote = "Each dosage level, expressed in milligrams per kilogram of body weight or other appropriate units"
issue = "The protocol gives no dosage levels or concentrations for induction and challenge."

[[protocol.section]]
heading = "Observations and Measurements"
text = """
Challenge sites are scored for erythema and edema on the Magnusson and Kligman scale 24 and 48 hours after the challenge patch is removed. Animals are observed daily for clinical signs and weighed on Days 0 and 23.
"""

[[protocol.section]]
heading = "Records"
text = """
The study keeps the protocol and its amendments, all raw data including skin reaction scores, test article receipt and use records, quality assurance reports, and the final report.
"""

[[protocol.section]]
heading = "Statistical Methods"
text = """
The proportion of animals with a positive challenge reaction is compared between the test and control groups with Fisher's exact test at a two-sided significance level of 0.05.
"""

[[protocol.section]]
heading = "Protocol Approval"
text = """
The sponsor approved this protocol on 4 March 2026. The study director, Dr. Omar Haddad, signed and dated it on 5 March 2026.
"""

[[protocol.section]]
heading = "Protocol Amendments"
text = """
The study director may approve changes to the protocol verbally while the study is running. Changes are summarized in the final report.
"""

[protocol.section.violation]
citation = "21 CFR 58.120(b)"
quote = "shall be documented, signed by the study director, dated, and maintained with the protocol"
issue = "Protocol changes are approved verbally instead of documented, signed, dated, and kept with the protocol."

[[protocol.section]]
heading = "Quality Assurance Reporting"
text = """
The quality assurance unit inspects the induction and challenge phases. It reports its findings to facility management once, at the end of the study.
"""

[protocol.section.violation]
citation = "21 CFR 58.35(b)(4)"
quote = "Periodically submit to management and the study director written status reports on each study"
issue = "Quality assurance reports go to management once at study end and never to the study director."

[[protocol]]
id = "glp-03"
domain = "GLP"
held_out = true
title = "Study RX-88-EFD: An Embryo-Fetal Development Study of RX-88 in Rabbits"

[[protocol.section]]
heading = "Title and Purpose"
text = """
This study evaluates the effects of RX-88 on embryo-fetal development when given orally to pregnant rabbits from gestation day 7 to 19.
"""

[[protocol.section]]
heading = "Test and Control Articles"
text = """
The test article is RX-88 (code RX-88-01, CAS 0000000-00-1). The control article is 0.5 percent methylcellulose in purified water. The sponsor determines and documents the identity, strength, purity, and composition of each batch of RX-88 and of the control article, documents the method of synthesis, and determined the stability of each before the study started. Reserve samples of each batch of test and control article are kept in the archive. The stability of RX-88 suspended in the vehicle for 8 days under refrigeration was shown before the study started.
"""

[[protocol.section]]
heading = "Sponsor and Testing Facility"
text = """
The sponsor is Rexon Pharma, Inc. The study is conducted at Northfield Preclinical Services, 45 Research Park Road, Durham, NC 27709.
"""

[[protocol.section]]
heading = "Study Director"
text = """
Dosing begins under the supervision of the senior technician. Testing facility management will designate a study director once the in-life phase is complete.
"""

[protocol.section.violation]
citation = "21 CFR 58.31(a)"
quote = "Designate a study director as described in § 58.33, before the study is initiated."
issue = "No study director is designated before the study starts."

[[protocol.section]]
heading = "Test System"
text = """
Ninety-six time-mated female New Zealand White rabbits of the RF:NZW substrain from Ridgeway Farms, 5 to 7 months old and weighing 3.0 to 4.5 kg, are assigned to four groups of 24. Each animal is identified by a tattoo and a cage card.
"""

[[protocol.section]]
heading = "Study Design"
text = """
Does are assigned to the four groups by computer-generated randomization stratified by body weight on gestation day 0. Fetal examinations are done by technicians who do not know the dose group.
"""

[[protocol.section]]
heading = "Diet"
text = """
Animals receive certified rabbit diet and filtered tap water ad libitum. The supplier analyzes each diet lot for heavy metals, aflatoxins, pesticides, and PCBs, and only lots within the facility's written contaminant specifications are used. The only material used to suspend RX-88 is the 0.5 percent methylcellulose vehicle.
"""

[[protocol.section]]
heading = "Dosage"
text = """
RX-88 is given by oral gavage once daily from gestation day 7 to 19 at 0, 10, 30, and 100 mg/kg/day, at a dose volume of 5 mL/kg. The high dose produced slight maternal toxicity in a dose range-finding study.
"""

[[protocol.section]]
heading = "Test Article Mixtures"
text = """
RX-88 is suspended in 0.5 percent methylcellulose each week. Dose formulations are not analyzed for concentration or homogeneity.
"""

[protocol.section.violation]
citation = "21 CFR 58.113(a)(1)"
quote = "To determine the uniformity of the mixture and to determine, periodically, the concentration of the test or control article in the mixture."
issue = "Test article mixtures are never tested for uniformity or concentration."

[[protocol.section]]
heading = "Data Recording"
text = """
All raw data are recorded directly and promptly in ink or in the validated data collection system. Each entry is dated and initialed, and changes do not obscure the original entry and state a reason.
"""

[[protocol.section]]
heading = "Observations and Measurements"
text = """
Does are observed twice daily and weighed on gestation days 0, 7, 10, 13, 16, 19, 24, and 29. On gestation day 29, does are euthanized and the uterine contents are examined. Each fetus is weighed, sexed, and examined for external, visceral, and skeletal changes.
"""

[[protocol.section]]
heading = "Records"
text = """
The study keeps the protocol and its amendments, all raw data, dose formulation records, test article receipt and use records, fetal specimens, quality assurance reports, and the final report.
"""

[[protocol.section]]
heading = "Statistical Methods"
text = """
Maternal body weights and fetal weights are compared between each dose group and the control with analysis of variance followed by Dunnett's test, with the litter as the unit of analysis. Fetal malformation and variation incidences are compared with Fisher's exact test on litter counts. Both use a two-sided significance level of 0.05.
"""

[[protocol.section]]
heading = "Protocol Approval"
text = """
The sponsor approved this protocol on 12 January 2026. The study director signs and dates the protocol when designated.
"""

[[protocol.section]]
heading = "Archiving"
text = """
Raw data, specimens, and study records are kept in the archive for 12 months after the final report is issued and are then destroyed.
"""

[protocol.section.violation]
citation = "21 CFR 58.195(b)"
quote = "shall be retained in the archive(s) for whichever of the following periods is shortest"
issue = "Records are destroyed after 12 months, shorter than every retention period the regulation allows."

[[protocol]]
id = "gcp-01"
domain = "GCP"
held_out = false
title = "Informed Consent Form: A Phase 2 Study of MG-12 for the Prevention of Migraine"

[[protocol.section]]
heading = "Purpose of the Study"
text = """
You are invited to take part in a research study. The study tests whether an experimental drug, MG-12, reduces the number of migraine days. Your participation will last about 20 weeks and includes eight clinic visits, a daily headache diary, and blood tests. MG-12 is experimental and is not approved by FDA.

You will be assigned by chance, like flipping a coin, to take either MG-12 or a placebo, a pill with no active drug. Neither you nor the study team will know which one you take. About 300 people will take part in this study.
"""

[[protocol.section]]
heading = "Risks and Discomforts"
text = """
In earlier studies, the most common side effects of MG-12 were nausea, tiredness, and dizziness. Blood draws may cause bruising. There may be risks that are not yet known.

MG-12 may harm an unborn baby in ways that are not yet known. You cannot take part if you are pregnant or breastfeeding, and you must use effective birth control during the study.
"""

[[protocol.section]]
heading = "Benefits"
text = """
Your migraines may improve, but this is not certain. What we learn may help other people with migraine.
"""

[[protocol.section]]
heading = "Alternatives"
text = """
You do not have to join this study to get treatment. Other preventive treatments, such as approved medicines, are available. Your doctor can discuss them with you.
"""

[[protocol.section]]
heading = "Confidentiality"
text = """
Your study records are kept confidential and identified only by a code number. Only the study team will ever see records that identify you.
"""

[protocol.section.violation]
citation = "21 CFR 50.25(a)(5)"
quote = "notes the possibility that the Food and Drug Administration may inspect the records"
issue = "The form promises that only the study team sees identifiable records and omits that FDA may inspect them."

[[protocol.section]]
heading = "Research-Related Injury"
text = """
If you have questions about the study drug, contact the study nurse during clinic hours.
"""

[protocol.section.violation]
citation = "21 CFR 50.25(a)(6)"
quote = "an explanation as to whether any compensation and an explanation as to whether any medical treatments are available if injury occurs"
issue = "The consent form for this more-than-minimal-risk study omits whether compensation or medical treatment is available after injury."

[[protocol.section]]
heading = "Voluntary Participation"
text = """
Once you are randomized, you are expected to complete all study visits. Participants who leave the study early must repay the $200 enrollment payment.
"""

[protocol.section.violation]
citation = "21 CFR 50.25(a)(8)"
quote = "the subject may discontinue participation at any time without penalty or loss of benefits to which the subject is otherwise entitled"
issue = "Leaving the study carries a repayment penalty, and the form omits that participation is voluntary."

[[protocol.section]]
heading = "Contacts"
text = """
For questions about the study or a research-related injury, call Dr. Rana Malik at 555-0142. For questions about your rights as a research participant, call the Lakeside IRB at 555-0199.
"""

[[protocol.section]]
heading = "Other Things to Know"
text = """
MG-12, placebo, and all study visits and tests are provided at no cost to you. The study doctor may take you out of the study without your consent if staying in would harm you, if you become pregnant, or if the sponsor stops the study. If you decide to leave the study, the study doctor will ask you to come to a final safety visit. We will tell you about any new findings during the study that might affect your willingness to stay in it.
"""

[[protocol.section]]
heading = "ClinicalTrials.gov"
text = """
A description of this clinical trial will be available on http://www.ClinicalTrials.gov, as required by U.S. Law. This Web site will not include information that can identify you. At most, the Web site will include a summary of the results. You can search this Web site at any time.
"""

