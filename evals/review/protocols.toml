Each component package bears the name and place of business of FlexKnee Orthopedics, the quantity of contents, and the statement "CAUTION—Investigational device. Limited by Federal (or United States) law to investigational use." The surgical technique guide describes all relevant contraindications, hazards, adverse effects, warnings, and precautions. Appendix B contains copies of all labeling.
"""

