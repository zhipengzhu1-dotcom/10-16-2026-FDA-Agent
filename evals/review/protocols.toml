[protocol.section.violation]
citation = "21 CFR 56.107(e)"
quote = "No IRB may have a member participate in the IRB's initial or continuing review of any project in which the member has a conflicting interest"
issue = "The principal investigator reviews and votes on his own protocol as an IRB member."

[[protocol.section]]
heading = "Continuing Review"
text = """
The IRB conducts continuing review of this trial every 24 months.
"""

[protocol.section.violation]
citation = "21 CFR 56.109(f)"
quote = "at intervals appropriate to the degree of risk, but not less than once per year"
issue = "Continuing review happens every 24 months; the regulation requires at least once per year."

[[protocol.section]]
heading = "Trial Monitoring"
text = """
Monitoring visits are scheduled at the sponsor's discretion. No written monitoring plan is prepared for this trial.
"""

[protocol.section.violation]
citation = "ICH E6(R3) 3.11.4.3"
quote = "The sponsor should develop a monitoring plan that is tailored to the identified potential safety risks"
issue = "The sponsor has no monitoring plan tailored to the trial's risks."

[[protocol.section]]
heading = "Statistical Considerations"
text = """
The trial has 85 percent power to detect a hazard ratio of 0.75 for overall survival at a two-sided alpha of 0.05, with one interim analysis at 50 percent of events reviewed by an independent data monitoring committee.
"""

[[protocol]]
id = "gcp-03"
domain = "GCP"
held_out = true
title = "Informed Consent and IRB Procedures: A Phase 2 Gene Therapy Study of GT-301 in Hemophilia B"

[[protocol.section]]
heading = "Purpose and Procedures"
text = """
This research study tests whether a single infusion of an experimental gene therapy, GT-301, raises factor IX activity in adults with hemophilia B. You will be in the study for 5 years, with weekly visits for the first 12 weeks and then visits every 3 months. This study is an applicable clinical trial under 42 U.S.C. 282(j).
"""

[[protocol.section]]
heading = "Risks"
text = """
GT-301 may cause liver inflammation, infusion reactions, and an immune response against the vector. The long-term effects of gene therapy are not known.
"""

[[protocol.section]]
heading = "Other Treatment Options"
text = """
This form does not describe other treatments. Your doctor can answer questions about other options after you enroll.
"""

[protocol.section.violation]
citation = "21 CFR 50.25(a)(4)"
quote = "A disclosure of appropriate alternative procedures or courses of treatment, if any, that might be advantageous to the subject."
issue = "The form leaves out alternatives such as factor IX replacement therapy."

[[protocol.section]]
heading = "Questions"
text = """
For questions about visit scheduling, call the clinic front desk.
"""

[protocol.section.violation]
citation = "21 CFR 50.25(a)(7)"
quote = "whom to contact in the event of a research-related injury to the subject"
issue = "The form names no contact for questions about the research, subjects' rights, or research-related injury."

[[protocol.section]]
heading = "Trial Registration"
text = """
Information about this study will not be posted on any public registry.
"""

[protocol.section.violation]
citation = "21 CFR 50.25(c)"
quote = "A description of this clinical trial will be available on http://www.ClinicalTrials.gov, as required by U.S. Law."
issue = "The consent for an applicable clinical trial omits the required ClinicalTrials.gov statement."

[[protocol.section]]
heading = "Consent Signature"
text = """
The participant signs and dates the consent form before any study procedure. The investigator who leads the consent discussion does not sign or date the form.
"""

[protocol.section.violation]
citation = "ICH E6(R3) 2.8.7"
quote = "and by the investigator or delegated investigator site staff who conducted the informed consent discussion"
issue = "The investigator who conducted the consent discussion does not sign and date the consent form."

[[protocol.section]]
heading = "IRB Records"
text = """
The IRB keeps the records of its review of this study for one year after the study closes.
"""

[protocol.section.violation]
citation = "21 CFR 56.115(b)"
quote = "shall be retained for at least 3 years after completion of the research"
issue = "IRB records are kept for one year after the study; the regulation requires at least 3 years."
