[[protocol]]
id = "ind-01"
domain = "IND"
held_out = false
title = "Protocol ABC-123-201: A Phase 2 Randomized, Double-Blind, Placebo-Controlled Study of ABC-123 in Moderate-to-Severe Plaque Psoriasis"

[[protocol.section]]
heading = "Objectives and Purpose"
text = """
The primary objective is to compare the proportion of patients who reach a 75 percent improvement in the Psoriasis Area and Severity Index (PASI-75) at Week 16 after oral ABC-123 or placebo.

Secondary objectives are to describe the safety and tolerability of ABC-123 and to characterize its steady-state pharmacokinetics.
"""

[[protocol.section]]
heading = "Investigators"
text = """
The coordinating investigator is Dr. Helen Park, Department of Dermatology, Lakeside University Hospital, 1200 Lake Drive, Madison, WI 53706. Each participating investigator signs Form FDA 1572 and provides a current curriculum vitae before site activation.

Appendix 1 lists the name and address of each investigator, the name of each subinvestigator, and the name and address of each research facility. The reviewing IRB for all sites is Lakeside Central IRB, 400 Main Street, Madison, WI 53703.
"""

[[protocol.section]]
heading = "Patient Selection"
text = """
Adults aged 18 to 70 years with plaque psoriasis covering at least 10 percent of body surface area and a PASI score of 12 or higher are eligible. Patients with active infection, a history of malignancy within five years, use of a biologic therapy within 12 weeks, pregnancy or breastfeeding, or unwillingness to use effective contraception are excluded.

The study will enroll approximately 240 patients at 30 sites.
"""

[[protocol.section]]
heading = "Study Design"
text = """
Patients are randomized 1:1:1:1 to ABC-123 10 mg, 30 mg, 60 mg, or placebo once daily for 16 weeks. Randomization is central and stratified by baseline PASI. Capsules are identical in appearance so that patients, investigators, and sponsor staff remain blinded to treatment.
"""

[[protocol.section]]
heading = "Dose Selection"
text = """
Doses were chosen from the Phase 1 multiple-ascending-dose study, in which exposures up to 80 mg daily were well tolerated. The planned maximum dose is 60 mg daily, and the maximum duration of exposure for an individual patient is 16 weeks.
"""

[[protocol.section]]
heading = "Assessments"
text = """
PASI is scored at screening and at Weeks 0, 4, 8, 12, and 16 by an assessor who does not know the patient's treatment. Plasma ABC-123 concentrations are measured before dosing at Weeks 4, 8, and 16.
"""

[[protocol.section]]
heading = "Safety Monitoring"
text = """
Vital signs, a physical examination, hematology, serum chemistry, liver function tests, and urinalysis are done at screening and at every visit. Study drug is stopped in any patient whose ALT or AST exceeds three times the upper limit of normal or who develops a serious infection.
"""

[[protocol.section]]
heading = "Safety Reporting"
text = """
The sponsor's pharmacovigilance group reviews every serious adverse event within one business day of receipt.

Serious and unexpected suspected adverse reactions are reported to FDA and all participating investigators in an IND safety report within 30 calendar days after the sponsor determines that the information qualifies for reporting. Other safety findings are summarized in the IND annual report.

Unexpected fatal or life-threatening suspected adverse reactions are also reported to FDA as soon as possible, and no later than 7 calendar days after the sponsor's initial receipt of the information.
"""

[protocol.section.violation]
citation = "21 CFR 312.32(c)(1)"
quote = "as soon as possible, but in no case later than 15 calendar days after the sponsor determines that the information qualifies for reporting"
issue = "IND safety reports are planned within 30 calendar days; the regulation requires no later than 15 calendar days."

[[protocol.section]]
heading = "Investigator Adverse Event Reporting"
text = """
Investigators record every adverse event in the electronic case report form. Serious adverse events are compiled at each site and sent to the sponsor as a monthly listing at the end of each calendar month.
"""

[protocol.section.violation]
citation = "21 CFR 312.64(b)"
quote = "An investigator must immediately report to the sponsor any serious adverse event, whether or not considered drug related"
issue = "Serious adverse events reach the sponsor in a monthly batch instead of immediately."

[[protocol.section]]
heading = "Record Retention"
text = """
Investigators keep all study records, including case report forms and drug dispensing logs, for one year after the final study visit. After that period, sites may destroy the records.
"""

[protocol.section.violation]
citation = "21 CFR 312.62(c)"
quote = "for a period of 2 years following the date a marketing application is approved for the drug for the indication for which it is being investigated"
issue = "Records may be destroyed one year after the last visit; investigators must keep them 2 years after approval or after the investigation is discontinued and FDA is notified."

[[protocol]]
id = "ind-02"
domain = "IND"
held_out = false
title = "Protocol XYZ-9-101: A Phase 1 First-in-Human Single and Multiple Ascending Dose Study of XYZ-9 in Healthy Adults"

[[protocol.section]]
heading = "Study Overview"
text = """
This is a single-site, randomized, double-blind, placebo-controlled study of XYZ-9 in 64 healthy adults. Part A tests single ascending doses in five cohorts. Part B tests 14 days of once-daily dosing in three cohorts.

The objective is to assess the safety, tolerability, and pharmacokinetics of single and multiple oral doses of XYZ-9.
"""

[[protocol.section]]
heading = "Investigator and Facilities"
text = """
The investigator is Dr. Samuel Reyes, Harborview Clinical Pharmacology Unit, 88 Pier Street, Baltimore, MD 21202, whose curriculum vitae is in Appendix 1. Subinvestigators are Dr. Ana Costa and Dr. Mark Liu. The study is conducted at the Harborview unit and reviewed by Chesapeake IRB, 15 Bay Road, Annapolis, MD 21401.
"""

[[protocol.section]]
heading = "Subject Selection"
text = """
Healthy men and women aged 18 to 55 years with a body mass index of 18 to 30 kg/m2 are eligible. Subjects are excluded for any clinically significant disease, an abnormal ECG or QTcF above 450 ms, abnormal liver or kidney function, pregnancy or breastfeeding, or use of any medication within 14 days.
"""

[[protocol.section]]
heading = "Dose Selection"
text = """
The starting single dose of 10 mg is one tenth of the human equivalent of the no-observed-adverse-effect level in the 28-day rat toxicity study. The planned maximum single dose is 400 mg, and the planned maximum multiple dose is 200 mg once daily for 14 days, which is the longest exposure of any subject.
"""

[[protocol.section]]
heading = "Study Start"
text = """
To keep the cohort schedule, screening and first dosing begin on the date the IND is submitted to FDA. The clinical unit has reserved beds for Cohort A1 starting that week.
"""

[protocol.section.violation]
citation = "21 CFR 312.40(d)"
quote = "An investigator may not administer an investigational new drug to human subjects until the IND goes into effect under paragraph (b) of this section."
issue = "Dosing starts on the IND submission date, before the IND goes into effect."

[[protocol.section]]
heading = "Dose Escalation"
text = """
Each cohort has eight subjects, six on XYZ-9 and two on placebo, with two sentinel subjects dosed 48 hours before the rest. A safety review committee reviews blinded safety and pharmacokinetic data before each escalation. The highest planned single dose is 400 mg.
"""

[[protocol.section]]
heading = "Expedited Safety Reporting"
text = """
Unexpected fatal or life-threatening suspected adverse reactions are reported to FDA within 15 calendar days after the sponsor's initial receipt of the information, together with other IND safety reports.
"""

[protocol.section.violation]
citation = "21 CFR 312.32(c)(2)"
quote = "in no case later than 7 calendar days after the sponsor's initial receipt of the information"
issue = "Fatal or life-threatening unexpected reactions get a 15-day clock; the regulation requires no later than 7 calendar days."

[[protocol.section]]
heading = "Protocol Amendments"
text = """
Increases in dose or the addition of cohorts take effect as soon as the sponsor's medical monitor approves them. The sponsor submits these amendments to FDA and to the IRB with the next IND annual report.
"""

[protocol.section.violation]
citation = "21 CFR 312.30(b)(2)(i)"
quote = "A protocol change under paragraph (b)(1) of this section may be made provided two conditions are met"
issue = "Dose increases take effect before the change is submitted to FDA and approved by the IRB."

[[protocol.section]]
heading = "Volunteer Recruitment"
text = """
Advertisements describe XYZ-9 as a safe and effective new treatment for chronic pain and invite volunteers to be among the first to benefit from it.
"""

[protocol.section.violation]
citation = "21 CFR 312.7(a)"
quote = "shall not represent in a promotional context that an investigational new drug is safe or effective for the purposes for which it is under investigation"
issue = "Recruitment material calls the investigational drug safe and effective."

[[protocol.section]]
heading = "Pharmacokinetic Sampling"
text = """
Blood samples for plasma XYZ-9 concentrations are drawn before dosing and at 0.5, 1, 2, 4, 8, 12, 24, and 48 hours after dosing. Samples are analyzed with a validated LC-MS/MS method.
"""

[[protocol.section]]
heading = "Safety Monitoring"
text = """
Subjects stay in the unit for 72 hours after each single dose and through Day 16 in Part B. Vital signs and 12-lead ECGs are recorded before dosing and at 1, 2, 4, 8, 24, and 48 hours after dosing, with continuous telemetry for the first 24 hours. Hematology, serum chemistry, and urinalysis are done at screening, on Days 2 and 7, and at follow-up. Dosing stops if two subjects in a cohort have the same severe adverse event or if any subject has a serious adverse event related to XYZ-9.
"""

[[protocol]]
id = "ind-03"
domain = "IND"
held_out = true
title = "Protocol DEF-5-301: A Phase 3 Randomized, Placebo-Controlled Trial of DEF-5 in Stage 2 Hypertension"

[[protocol.section]]
heading = "Objectives"
text = """
The primary objective is to show that DEF-5 40 mg once daily lowers mean seated systolic blood pressure more than placebo after 12 weeks. The secondary objective is to assess safety over 52 weeks of open-label extension.
"""

[[protocol.section]]
heading = "Sites and Review Boards"
text = """
Appendix 1 lists the name and address of each investigator and of each research facility, and the names of the subinvestigators at each site. Every site is reviewed by Central Medical IRB, 2100 Oak Avenue, Columbus, OH 43215.
"""

[[protocol.section]]
heading = "Patient Selection"
text = """
Adults aged 30 to 80 years with a mean seated systolic blood pressure of 160 to 179 mmHg after a two-week washout are eligible. Patients are excluded for secondary hypertension, a myocardial infarction or stroke within six months, an eGFR below 30 mL/min/1.73 m2, or pregnancy.
"""

[[protocol.section]]
heading = "Investigator Qualification"
text = """
Before a site is activated, the principal investigator signs the sponsor's Site Participation Agreement and provides a current curriculum vitae. The sponsor does not collect a separate signed investigator statement from sites.
"""

[protocol.section.violation]
citation = "21 CFR 312.53(c)(1)"
quote = "A signed investigator statement (Form FDA-1572) containing"
issue = "Investigators begin participation without a signed Form FDA-1572."

[[protocol.section]]
heading = "Study Design"
text = """
Eligible patients are randomized 1:1 to DEF-5 or placebo for 12 weeks, stratified by age group and diabetes status. Rescue medication is allowed if seated systolic pressure exceeds 180 mmHg. About 900 patients will be enrolled at 110 sites.

Tablets are identical in appearance, and patients, investigators, and the sponsor's analysts remain blinded to treatment until the 12-week database lock.
"""

[[protocol.section]]
heading = "Dose Selection"
text = """
The 40 mg dose gave the best balance of blood pressure reduction and tolerability among the 10, 20, 40, and 80 mg doses in the Phase 2 dose-ranging study. The planned maximum dose is 40 mg once daily. Individual exposure lasts up to 64 weeks, 12 blinded and 52 open-label.
"""

[[protocol.section]]
heading = "Assessments and Safety Monitoring"
text = """
Seated blood pressure is measured in triplicate with a validated automated device at every visit, and 24-hour ambulatory blood pressure is recorded at baseline and Week 12. Serum potassium, creatinine, and liver function tests are measured at Weeks 2, 6, and 12 and every 3 months in the extension. Study drug is stopped in any patient with serum potassium above 6.0 mmol/L, symptomatic hypotension, or a 50 percent rise in creatinine.
"""

[[protocol.section]]
heading = "Investigational Product Accountability"
text = """
Study drug is dispensed from site stock at each visit. Sites do not record the quantities dispensed to or returned by each patient. Unused drug is returned to the sponsor at the end of the study.
"""

[protocol.section.violation]
citation = "21 CFR 312.62(a)"
quote = "An investigator is required to maintain adequate records of the disposition of the drug, including dates, quantity, and use by subjects."
issue = "No records are kept of the drug dispensed to or returned by each patient."

[[protocol.section]]
heading = "Case Report Forms"
text = """
Case report forms capture vital signs, laboratory results, concomitant medications, and adverse events. Signed consent forms are filed by the site's administrative office, and the case history does not record when consent was obtained.
"""

[protocol.section.violation]
citation = "21 CFR 312.62(b)"
quote = "The case history for each individual shall document that informed consent was obtained prior to participation in the study."
issue = "Case histories do not document that consent was obtained before participation."

[[protocol.section]]
heading = "Discontinuation for Safety"
text = """
If the sponsor determines that DEF-5 presents an unreasonable and significant risk to subjects, enrollment is paused and the data monitoring committee reviews the data at its next scheduled meeting. FDA is told of any discontinuation in the next IND annual report.
"""

[protocol.section.violation]
citation = "21 CFR 312.56(d)"
quote = "in no event later than 5 working days after making the determination that the investigation should be discontinued"
issue = "A study with unreasonable and significant risk is not discontinued within 5 working days, and FDA is told only in the annual report."

[[protocol.section]]
heading = "Statistical Analysis"
text = """
The primary endpoint is analyzed with a mixed model for repeated measures that includes treatment, visit, treatment-by-visit interaction, and baseline systolic pressure. A sample of 900 patients gives 90 percent power to detect a 5 mmHg difference at a two-sided alpha of 0.05.
"""

[[protocol]]
id = "ide-01"
domain = "IDE"
held_out = false
title = "Investigational Plan CT-200: Pivotal Study of the CardioTrace Implantable Cardiac Monitor"

[[protocol.section]]
heading = "Purpose"
text = """
CardioTrace is a subcutaneous implantable cardiac monitor intended to detect atrial fibrillation in patients with cryptogenic stroke. The study objective is to show that the 12-month atrial fibrillation detection rate exceeds 7 percent. The investigation lasts 24 months. The sponsor has determined that CardioTrace is a significant risk device and has an approved IDE.
"""

[[protocol.section]]
heading = "Protocol"
text = """
This is a single-arm study. Each subject receives CardioTrace within 90 days after the index stroke, and an independent core laboratory adjudicates every detected episode of atrial fibrillation lasting 2 minutes or longer. Assuming a true 12-month detection rate of 12 percent, a sample of 400 subjects gives 90 percent power to show that the rate exceeds 7 percent, the rate seen with external monitoring, at a one-sided alpha of 0.025.
"""

[[protocol.section]]
heading = "Risk Analysis"
text = """
Risks include infection at the insertion site, device migration, and skin erosion. Each is minimized by sterile technique, a standardized pocket depth, and follow-up visits at 7 days, 3 months, and 12 months.

The investigation is justified because undetected atrial fibrillation after cryptogenic stroke leaves patients without anticoagulation that can prevent a second stroke. The study enrolls 400 men and women aged 40 to 85 years who had a cryptogenic ischemic stroke within the past 90 days.
"""

[[protocol.section]]
heading = "Device Description"
text = """
The device is a 1.2 cc titanium housing with two sensing electrodes, a lithium battery, and a Bluetooth transmitter. It is inserted through a 10 mm incision under local anesthesia.

The electrodes record a single-lead subcutaneous ECG, and an onboard algorithm flags irregular R-R intervals as possible atrial fibrillation and transmits the recordings to the clinic each night. No change to the device is planned during the investigation.
"""

[[protocol.section]]
heading = "Monitoring"
text = """
Monitors follow the sponsor's written monitoring procedures, SOP CT-MON-01, and visit each site after its first subject and then every 3 months to verify source data and device accountability. The lead monitor is Karen Wu, CardioTrace Inc., 900 Innovation Way, Minneapolis, MN 55413. Appendix E lists the name and address of every monitor.
"""

[[protocol.section]]
heading = "Device Labeling"
text = """
Each device carton is labeled with the manufacturer's name and address, the lot number, and the statement "For Research Use Only." Contraindications, warnings, and precautions are given in the Instructions for Use.
"""

[protocol.section.violation]
citation = "21 CFR 812.5(a)"
quote = "CAUTION—Investigational device. Limited by Federal (or United States) law to investigational use."
issue = "The label says \"For Research Use Only\" instead of the required investigational device caution statement."

[[protocol.section]]
heading = "Informed Consent Materials"
text = """
Appendix C contains the consent form and the patient information booklet that subjects receive before they agree to take part.
"""

[[protocol.section]]
heading = "IRB Information"
text = """
Appendix D lists the name, location, and chairperson of every IRB that has reviewed or will review the investigation, with a copy of each IRB's approval letter.
"""

[[protocol.section]]
heading = "Other Institutions"
text = """
ECG adjudication is done at Heartline Core Laboratory, 30 Elm Street, Boston, MA 02115. No other institution outside the IRB list takes part.
"""

[[protocol.section]]
heading = "Adverse Device Effect Reporting by Investigators"
text = """
Investigators report unanticipated adverse device effects to the sponsor and to the reviewing IRB within 30 calendar days after the investigator first learns of the effect.
"""

[protocol.section.violation]
citation = "21 CFR 812.150(a)(1)"
