issue = "No drug disposition records are kept, and unused drug is discarded locally."

[[protocol.section]]
heading = "Case Report Forms"
text = """
Case report forms capture vital signs, laboratory results, concomitant medications, and adverse events. Signed consent forms are filed by the site's administrative office, and the case history does not record when consent was obtained.
"""

[protocol.section.violation]
citation = "21 CFR 312.62(b)"
quote = "The case history for each individual shall document that informed consent was obtained prior to participation in the study."
issue = "Case histories do not document that consent was obtained before participation."

[[protocol.section]]
heading = "Discontinuation for Safety"
text = """
If the sponsor determines that DEF-5 presents an unreasonable and significant risk to subjects, enrollment is paused and the data monitoring committee reviews the data at its next scheduled meeting. FDA is told of any discontinuation in the next IND annual report.
"""

[protocol.section.violation]
citation = "21 CFR 312.56(d)"
