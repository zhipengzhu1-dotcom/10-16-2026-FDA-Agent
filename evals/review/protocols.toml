[[protocol]]
id = "ind-01"
domain = "IND"
held_out = false
title = "Protocol ABC-123-201: A Phase 2 Randomized, Double-Blind, Placebo-Controlled Study of ABC-123 in Moderate-to-Severe Plaque Psoriasis"

[[protocol.section]]
heading = "Objectives and Purpose"
text = """
The primary objective is to compare the proportion of patients who reach a 75 percent improvement in the Psoriasis Area and Severity Index (PASI-75) at Week 16 after oral ABC-123 or placebo.

Secondary objectives are to describe the safety and tolerability of ABC-123 and to characterize its steady-state pharmacokinetics.
"""

[[protocol.section]]
heading = "Investigators"
text = """
The coordinating investigator is Dr. Helen Park, Department of Dermatology, Lakeside University Hospital, 1200 Lake Drive, Madison, WI 53706. Each participating investigator signs Form FDA 1572 and provides a current curriculum vitae before site activation. The sponsor keeps a list of all investigators and subinvestigators in the trial master file.
"""

[[protocol.section]]
heading = "Patient Selection"
text = """
Adults aged 18 to 70 years with plaque psoriasis covering at least 10 percent of body surface area and a PASI score of 12 or higher are eligible. Patients with active infection, a history of malignancy within five years, or use of a biologic therapy within 12 weeks are excluded.

The study will enroll approximately 240 patients at 30 sites.
"""

[[protocol.section]]
heading = "Study Design"
text = """
Patients are randomized 1:1:1:1 to ABC-123 10 mg, 30 mg, 60 mg, or placebo once daily for 16 weeks. Randomization is central and stratified by baseline PASI. Capsules are identical in appearance so that patients, investigators, and sponsor staff remain blinded to treatment.
"""

[[protocol.section]]
heading = "Dose Selection"
text = """
Doses were chosen from the Phase 1 multiple-ascending-dose study, in which exposures up to 80 mg daily were well tolerated. The planned maximum dose is 60 mg daily, and the maximum duration of exposure for an individual patient is 16 weeks.
"""

[[protocol.section]]
heading = "Safety Reporting"
text = """
The sponsor's pharmacovigilance group reviews every serious adverse event within one business day of receipt.

Serious and unexpected suspected adverse reactions are reported to FDA and all participating investigators in an IND safety report within 30 calendar days after the sponsor determines that the information qualifies for reporting. Other safety findings are summarized in the IND annual report.
"""

[protocol.section.violation]
citation = "21 CFR 312.32(c)(1)"
quote = "as soon as possible, but in no case later than 15 calendar days after the sponsor determines that the information qualifies for reporting"
issue = "IND safety reports are planned within 30 calendar days; the regulation requires no later than 15 calendar days."

[[protocol.section]]
heading = "Investigator Adverse Event Reporting"
text = """
Investigators record every adverse event in the electronic case report form. Serious adverse events are compiled at each site and sent to the sponsor as a monthly listing at the end of each calendar month.
"""

[protocol.section.violation]
citation = "21 CFR 312.64(b)"
quote = "An investigator must immediately report to the sponsor any serious adverse event, whether or not considered drug related"
issue = "Serious adverse events reach the sponsor in a monthly batch instead of immediately."

[[protocol.section]]
heading = "Record Retention"
text = """
Investigators keep all study records, including case report forms and drug dispensing logs, for one year after the final study visit. After that period, sites may destroy the records.
"""

[protocol.section.violation]
citation = "21 CFR 312.62(c)"
quote = "for a period of 2 years following the date a marketing application is approved for the drug for the indication for which it is being investigated"
issue = "Records may be destroyed one year after the last visit; investigators must keep them 2 years after approval or after the investigation is discontinued and FDA is notified."

[[protocol]]
id = "ind-02"
domain = "IND"
held_out = false
title = "Protocol XYZ-9-101: A Phase 1 First-in-Human Single and Multiple Ascending Dose Study of XYZ-9 in Healthy Adults"

[[protocol.section]]
heading = "Study Overview"
text = """
This is a single-site, randomized, double-blind, placebo-controlled study of XYZ-9 in 64 healthy adults. Part A tests single ascending doses in five cohorts. Part B tests 14 days of once-daily dosing in three cohorts.
"""

[[protocol.section]]
heading = "Study Start"
text = """
To keep the cohort schedule, screening and first dosing begin on the date the IND is submitted to FDA. The clinical unit has reserved beds for Cohort A1 starting that week.
"""

