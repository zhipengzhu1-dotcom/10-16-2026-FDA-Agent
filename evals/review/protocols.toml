Appendix C contains the consent form and the subject diary instructions given to subjects during the consent discussion.
"""

[[protocol.section]]
heading = "IRB Information"
text = """
Appendix D lists the name, location, and chairperson of each site's IRB, with a copy of each IRB's approval letter.
"""

[[protocol.section]]
heading = "Other Institutions"
text = """
Reference glucose is measured at Pacific Reference Laboratory, 400 Mesa Road, San Diego, CA 92121. No other institution takes part.
"""

[[protocol.section]]
heading = "Protocol Deviations"
text = """
If an investigator departs from the plan to protect a subject in an emergency, the deviation is listed in the investigator's final report to the sponsor.
"""

[protocol.section.violation]
citation = "21 CFR 812.150(a)(4)"
