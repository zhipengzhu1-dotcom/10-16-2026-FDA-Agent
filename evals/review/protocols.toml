quote = "for a period of 2 years after the latter of the following two dates"
issue = "Records are kept for one year; the regulation requires 2 years after the later of completion or the end of their use in a marketing submission."

[[protocol.section]]
heading = "Additional Records and Reports"
text = """
Beyond the records and reports required by 21 CFR 812 subpart G, the sponsor keeps the core laboratory's adjudication records and sends investigators a quarterly summary of device transmissions.
"""

[[protocol]]
id = "ide-02"
domain = "IDE"
held_out = false
title = "Investigational Plan GS-110: Feasibility Study of the GlucoSense Implanted Continuous Glucose Sensor"

[[protocol.section]]
heading = "Purpose"
text = """
GlucoSense is a fully implanted glucose sensor intended for adults with type 1 diabetes. This feasibility study enrolls 30 subjects for 180 days to estimate sensor accuracy against laboratory reference glucose.
"""

[[protocol.section]]
heading = "Regulatory Pathway"
text = """
The sponsor has classified the GlucoSense implanted sensor as a significant risk device. The study will start when each site's IRB approves it, and the sponsor will not submit an IDE application to FDA.
"""

[protocol.section.violation]
citation = "21 CFR 812.20(a)(1)"
quote = "A sponsor shall submit an application to FDA if the sponsor intends to use a significant risk device in an investigation"
issue = "A significant risk device study proceeds on IRB approval alone without an IDE application to FDA."

[[protocol.section]]
heading = "Study Procedures"
text = """
The sensor is implanted in the upper arm in an outpatient procedure. Subjects attend in-clinic sessions on Days 7, 30, 90, and 180 with venous sampling every 15 minutes for 8 hours.

Accuracy is reported as the mean absolute relative difference between paired sensor and laboratory glucose values, with a 95 percent confidence interval. Thirty subjects give about 3,900 paired values, enough to estimate that difference within 2 percentage points.
"""

[[protocol.section]]
heading = "Risk Analysis"
text = """
Risks include infection, bleeding, or bruising at the insertion site, sensor extrusion, and wrong insulin doses based on inaccurate readings. These are minimized by sterile implantation, wound checks on Day 7, and fingerstick confirmation of every reading before an insulin dose.

The investigation is justified because a fully implanted sensor could remove the daily burden of external sensors. Subjects are 30 men and women aged 18 to 65 years who have had type 1 diabetes for at least 2 years.
"""

[[protocol.section]]
heading = "Device Description"
text = """
The sensor is a 3.5 by 18 mm polymer cylinder holding a fluorescent glucose-indicating hydrogel, a light-emitting diode, and a photodetector. An external reader worn over the site powers the sensor and converts its fluorescence signal to a glucose value every 5 minutes. No change to the device is planned during the investigation.
"""

[[protocol.section]]
heading = "Monitoring"
text = """
Site monitoring is arranged separately by the sponsor's clinical operations group and is not described in this investigational plan.
"""

[protocol.section.violation]
citation = "21 CFR 812.25(e)"
quote = "The sponsor's written procedures for monitoring the investigation and the name and address of any monitor."
issue = "The investigational plan has no written monitoring procedures and names no monitor."

[[protocol.section]]
