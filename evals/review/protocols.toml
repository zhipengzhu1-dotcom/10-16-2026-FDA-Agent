held_out = true
title = "Investigational Plan FK-300: Pivotal Study of the FlexKnee Total Knee Implant"

[[protocol.section]]
heading = "Purpose"
text = """
FlexKnee is a cemented total knee implant with a mobile polyethylene bearing, intended for primary total knee replacement in adults with osteoarthritis of the knee. The study enrolls 320 subjects at 20 sites to show that two-year survivorship exceeds a 95 percent performance goal. The investigation lasts about 4 years, 2 for enrollment and 2 for follow-up. FlexKnee is a significant risk device and the IDE is approved.
"""

[[protocol.section]]
heading = "Follow-up Schedule"
text = """
Subjects return at 6 weeks, 6 months, 1 year, and 2 years for knee scores and standing radiographs. A core laboratory reads all radiographs blinded to site.

Two-year survivorship, free of revision of any component, is estimated by the Kaplan-Meier method. With 320 subjects and 10 percent loss to follow-up, the study has 85 percent power to show that the lower 95 percent confidence bound exceeds the 95 percent performance goal.
"""

[[protocol.section]]
heading = "Risk Analysis"
text = """
Risks are those of knee replacement surgery, such as infection, blood clots, stiffness, and loosening, plus bearing dislocation, which is specific to mobile bearings. They are minimized by surgeon training on the instruments, antibiotic and blood clot prophylaxis, and radiographic follow-up.

The investigation is justified because a mobile bearing may reduce polyethylene wear. Subjects are 320 men and women aged 50 to 80 years with knee osteoarthritis that needs a primary total knee replacement.
"""

[[protocol.section]]
heading = "Device Description"
text = """
FlexKnee has a cobalt-chromium femoral component, a titanium tibial tray, and a highly crosslinked polyethylene bearing that rotates on the tray. All components are fixed with bone cement. No change to the device is planned during the investigation.
"""

[[protocol.section]]
heading = "Monitoring"
text = """
Monitors follow the sponsor's written monitoring procedures, SOP FK-MON-02, and visit each site at least twice a year. The lead monitor is David Osei, FlexKnee Orthopedics, 77 Commerce Street, Warsaw, IN 46580. Appendix E lists the name and address of every monitor.
"""

