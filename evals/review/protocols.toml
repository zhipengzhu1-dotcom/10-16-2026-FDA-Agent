The Riverside Cancer Center IRB reviews this protocol. It is a three-member committee. Dr. Luis Alvarez is an oncologist at the center. Rev. Anne Lowe is the center's chaplain. James Okafor is a retired schoolteacher who is not affiliated with the center and has no immediate family member who is.
