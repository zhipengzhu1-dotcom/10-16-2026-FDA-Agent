heading = "Risks"
text = """
GT-301 may cause liver inflammation, infusion reactions, and an immune response against the vector. The long-term effects of gene therapy are not known.

GT-301 could harm an unborn child in ways that are not yet known. You and any partner must use effective birth control for 12 months after the infusion.
"""

[[protocol.section]]
heading = "Possible Benefits"
text = """
GT-301 may raise your factor IX activity enough to reduce bleeding episodes, but this is not certain. What we learn may help other people with hemophilia B.
"""

[[protocol.section]]
heading = "Confidentiality"
text = """
Your study records are identified by a code number and kept confidential to the extent permitted by law. The Food and Drug Administration, the sponsor, and the IRB may inspect records that identify you.
