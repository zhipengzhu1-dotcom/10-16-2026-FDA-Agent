Appendix C contains the consent form that subjects review and sign before surgery.
"""

[[protocol.section]]
heading = "IRB Information"
text = """
Appendix D lists the name, location, and chairperson of each IRB that has reviewed or will review the investigation, with a copy of each IRB's approval letter.
"""

[[protocol.section]]
