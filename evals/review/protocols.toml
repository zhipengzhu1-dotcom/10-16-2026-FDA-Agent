[[protocol.section]]
heading = "Statistical Analysis"
text = """
The primary endpoint is analyzed with a mixed model for repeated measures that includes treatment, visit, treatment-by-visit interaction, and baseline systolic pressure. A sample of 900 patients gives 90 percent power to detect a 5 mmHg difference at a two-sided alpha of 0.05.
"""

