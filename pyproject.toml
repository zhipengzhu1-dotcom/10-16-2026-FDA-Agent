[project]
name = "fda-copilot"
version = "0.1.0"
description = "Multi-agent reviewer that checks study documents against FDA regulations with cited findings."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic",
    "fastapi",
    "langgraph",
    "psycopg[binary]",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "pyyaml>=6",
    "uvicorn",
    "voyageai",
]

[project.scripts]
fda-copilot = "fda_copilot.cli:main"

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "ruff",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fda_copilot"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
